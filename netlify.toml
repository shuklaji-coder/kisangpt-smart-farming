[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  TSC_COMPILE_ON_ERROR = "true"
  DISABLE_ESLINT_PLUGIN = "true"
  GENERATE_SOURCEMAP = "false"
  NODE_VERSION = "18"

# React Router SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
